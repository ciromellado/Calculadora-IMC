<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC Mixta (Niños y Adultos)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="imagen/" href="img/icon.webp">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <div id="authScreen" class="container">
        <h1>Activar Calculadora IMC</h1>
        <p class="subtitle">Introduce tu clave de acceso única</p>
        <div class="card">
            <div class="input-group">
                <label for="licenseKey">Clave de Activación</label>
                <input type="text" id="licenseKey" placeholder="ejemp:VIP-........">
            </div>
            <button id="activateBtn">Activar Aplicación</button>
            <p id="authError" class="error-text hidden">Clave inválida o ya en uso.</p>
        </div>
    </div>

    <div id="appScreen" class="container hidden">
        <h1>Calculadora de IMC</h1>
        <img src="img/logo.webp" width="50" height="50" alt="logo-webp">
        <p class="subtitle">Adultos y Pediatría (Offline)</p>

        <div class="card">
            <div class="input-group">
                <label for="ageType">Selección por Edad</label>
                <select id="ageType">
                    <option value="adult">Adulto (20 años en adelante)</option>
                    <option value="child">Niño / Adolescente (2 a 19 años)</option>
                </select>
            </div>

            <div class="input-group hidden" id="genderGroup">
                <label for="gender">Sexo</label>
                <select id="gender">
                    <option value="male">Masculino (Niño)</option>
                    <option value="female">Femenino (Niña)</option>
                </select>
            </div>

            <div class="input-group hidden" id="ageGroup">
                <label for="age">Edad (Años cumplidos)</label>
                <input type="number" id="age" min="2" max="19" placeholder="Ej. 10">
            </div>

            <div class="input-group">
                <label for="weight">Peso (kg)</label>
                <input type="number" id="weight" step="0.1" placeholder="Ej. 70">
            </div>

            <div class="input-group">
                <label for="height">Altura (cm)</label>
                <input type="number" id="height" step="1" placeholder="Ej. 175">
            </div>

            <button id="calculateBtn">Calcular IMC</button>

            <div id="resultContainer" class="hidden">
                <h2>Tu Resultado</h2>
                <div id="bmiValue">0.0</div>
                <div id="bmiCategory">-</div>
                <div id="bmiDetail" class="detail-text"></div>
                
                <button id="resetBtn" class="reset-btn">Calcular de nuevo</button>
            </div>

            <button id="logoutBtn" class="secondary-btn">Cerrar Sesión</button>
        </div>
    </div>
    <script src="auth.js"></script>

    <script src="app.js"></script>
</body>
</html>
